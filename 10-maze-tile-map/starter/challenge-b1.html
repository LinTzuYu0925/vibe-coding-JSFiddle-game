<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>迷宮尋寶：挑戰 B-1（巡邏的怪物）</title>
  <style>
/* ===== CSS 窗格 ===== */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: #10182b;
  font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  color: white;
  display: flex;
  justify-content: center;
}

#game {
  position: relative;
  width: min(100%, 560px);
  min-height: 560px;
  background: #17243a;
  border: 3px solid #344968;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 15px 50px #0008;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: linear-gradient(90deg, #10233c, #1e4260);
}
.brand { font-size: 22px; font-weight: 900; color: #ffd43b; }
.stat { font-weight: bold; color: #c8d8ef; }
.stat b { color: #ffe45e; font-size: 20px; }

/* 地圖：每一格是一個 div，欄數由 JavaScript 設定 */
#board {
  display: grid;
  gap: 2px;
  margin: 14px auto 8px;
  width: 484px;
  max-width: calc(100% - 24px);
}
.tile {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  line-height: 1;
  border-radius: 6px;
  background: #223656;                 /* 地板 */
}
.tile.wall { background: #5b6b8a; box-shadow: inset 0 -4px 0 #3b4a68; }
.tile.exit { background: #3b5a2e; }
.tile.door { background: #6b4a1e; }
.tile.player { background: #2f5d8a; }

/* 訊息列：「撞到牆了」「拿到鑰匙了」等 */
#message {
  min-height: 30px;
  text-align: center;
  font-size: 20px;
  font-weight: 900;
  color: #ffe45e;
}

/* 螢幕方向鍵（滑鼠也能玩，不用先點遊戲視窗） */
#dpad {
  display: grid;
  grid-template-columns: repeat(3, 54px);
  grid-template-rows: repeat(2, 46px);
  gap: 6px;
  justify-content: center;
  margin: 8px 0 12px;
}
#dpad button {
  font-size: 22px;
  color: white;
  background: #2d4570;
  border: 2px solid #5c7fb8;
  border-radius: 10px;
  cursor: pointer;
}
#dpad button:active { background: #3f63a0; }
#btnUp { grid-column: 2; grid-row: 1; }
#btnLeft { grid-column: 1; grid-row: 2; }
#btnDown { grid-column: 2; grid-row: 2; }
#btnRight { grid-column: 3; grid-row: 2; }

/* 開始、勝利、失敗畫面 */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  background: #0b1222f0;
}
.overlay h1 { margin: 0; font-size: 44px; }
.overlay p { margin: 0; font-size: 20px; color: #c8d8ef; }
#startScreen h1 { color: #74c0fc; }
#winScreen h1 { color: #ffa94d; }
#loseScreen h1 { color: #ff6b6b; }

.overlay button {
  margin-top: 12px;
  padding: 12px 34px;
  font-size: 22px;
  font-weight: 900;
  color: #10182b;
  background: linear-gradient(#fff36b, #ffc940);
  border: none;
  border-radius: 999px;
  box-shadow: 0 5px 0 #c08a00;
  cursor: pointer;
}

.hidden { display: none !important; }
  </style>
</head>
<body>
<!-- ===== HTML 窗格 ===== -->
<div id="game">
  <div class="topbar">
    <span class="brand">🗝️ 迷宮尋寶</span>
    <span class="stat">第 <b id="levelNum">1</b> / <b id="levelTotal">1</b> 關</span>
    <span class="stat">🔑 <b id="keyStat">沒有</b></span>
    <span class="stat">⚡ <b id="energy">40</b></span>
  </div>

  <div id="board"></div>
  <div id="message"></div>

  <div id="dpad">
    <button id="btnUp">⬆️</button>
    <button id="btnLeft">⬅️</button>
    <button id="btnDown">⬇️</button>
    <button id="btnRight">➡️</button>
  </div>

  <div id="startScreen" class="overlay">
    <h1>🗝️ 迷宮尋寶</h1>
    <p>用方向鍵走迷宮</p>
    <p>走到 🏁 就過關！</p>
    <button id="startBtn">▶ 開始</button>
  </div>

  <div id="winScreen" class="overlay hidden">
    <h1>🏆 你走出迷宮了！</h1>
    <p id="winText">找到寶藏，過關！</p>
    <button class="againBtn">↻ 再玩一次</button>
  </div>

  <div id="loseScreen" class="overlay hidden">
    <h1>😵 體力用完了</h1>
    <p id="loseText">再試一次吧！</p>
    <button class="againBtn">↻ 再玩一次</button>
  </div>
</div>

  <script>
/* ===== JavaScript 窗格 ===== */
// ===== 迷宮尋寶：挑戰 B-1（巡邏的怪物） =====
// 老師做的挑戰範例：從「完整版」多加了一個新點子。

// ===== 地圖（資料）=====
// 一行字是一排。# 牆　. 地板　P 玩家起點　E 出口　K 鑰匙　D 門　M 怪物
const maps = [
  [
    "###########",
    "#P..#.....#",
    "#.#.#.###.#",
    "#.#...#K#.#",
    "#.#####.#.#",
    "#...M...#.#",
    "#.#####.#.#",
    "#.#E..D...#",
    "###########",
  ],
  [
    "###########",
    "#P..#...#E#",
    "##.##.#.#D#",
    "#.M.#.#...#",
    "#.#.#.###.#",
    "#.#...#...#",
    "#.###.#.###",
    "#K....#...#",
    "###########",
  ],
  [
    "###########",
    "#P#.....#E#",
    "#.#.###.#D#",
    "#.#.#K#...#",
    "#.#.#.#.###",
    "#...#.....#",
    "###.#####.#",
    "#...#..M..#",
    "###########",
  ],
];

// ===== 遊戲規則 =====
const board = document.getElementById("board");
const message = document.getElementById("message");
const levelNum = document.getElementById("levelNum");
const levelTotal = document.getElementById("levelTotal");
const keyStat = document.getElementById("keyStat");
const energyText = document.getElementById("energy");
const startScreen = document.getElementById("startScreen");
const winScreen = document.getElementById("winScreen");
const loseScreen = document.getElementById("loseScreen");
const winText = document.getElementById("winText");

// 每一關開始時有幾點體力（測試時可以先改成 3）
const maxEnergy = 40;

// 遊戲現在的樣子
let level = 0;          // 第幾關（從 0 開始數）
let grid = [];          // 這一關的地圖，grid[y][x] 是一個字，例如 "#"
let px = 0;             // 玩家在第幾欄 x（從 0 開始數）
let py = 0;             // 玩家在第幾排 y（從 0 開始數）
let hasKey = false;     // 有沒有鑰匙
let energy = maxEnergy; // 剩幾點體力
let playing = false;    // 遊戲正在進行嗎
let monsters = [];      // 怪物：每隻有 x、y、dir（1 往右、-1 往左）
let startX = 0;         // 這一關玩家出發的位置（被怪物撞到要回來）
let startY = 0;
let hasSword = false;   // 有沒有劍
let steps = 0;          // 這一關走了幾步

// 載入第 n 關：把 maps[n] 的文字變成 grid，找到 P 放玩家
function loadMap(n) {
  level = n;
  grid = maps[n].map(function (row) {
    return row.split("");
  });
  hasKey = false;
  energy = maxEnergy;
  monsters = [];
  hasSword = false;
  steps = 0;
  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      if (grid[y][x] === "M") {      // 怪物：記下位置，那一格變地板
        monsters.push({ x: x, y: y, dir: 1 });
        grid[y][x] = ".";
      }
      if (grid[y][x] === "P") {
        px = x;
        py = y;
        grid[y][x] = ".";      // 起點變成地板
      }
    }
  }
  startX = px;
  startY = py;
  showMessage("");
  drawMap();
  updateTop();
}

// 把 grid 畫到畫面上：每個字畫成一格
function drawMap() {
  board.innerHTML = "";
  board.style.gridTemplateColumns = "repeat(" + grid[0].length + ", 1fr)";
  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      const c = grid[y][x];
      if (c === "#") tile.classList.add("wall");
      if (c === "E") { tile.classList.add("exit"); tile.textContent = "🏁"; }
      if (c === "K") tile.textContent = "🔑";
      if (c === "D") { tile.classList.add("door"); tile.textContent = "🚪"; }
      if (monsterAt(x, y)) tile.textContent = "👻";
      if (x === px && y === py) { tile.classList.add("player"); tile.textContent = "🧑"; }
      board.appendChild(tile);
    }
  }
}

// 更新上方的第幾關、鑰匙、體力
function updateTop() {
  levelNum.textContent = level + 1;
  levelTotal.textContent = maps.length;
  keyStat.textContent = hasKey ? "有" : "沒有";
  energyText.textContent = energy;
}

// 在地圖下面顯示一句話（空字串就是清掉）
function showMessage(text) {
  message.textContent = text;
}

// 這一格能不能走（不是牆、不是門、沒有跑出地圖）
function canWalk(x, y) {
  const row = grid[y];
  return row !== undefined && row[x] !== undefined && row[x] !== "#" && row[x] !== "D";
}

// 這一格有沒有怪物
function monsterAt(x, y) {
  return monsters.find(function (m) { return m.x === x && m.y === y; });
}

// 玩家碰到怪物。傳回 true 代表玩家被撞到（回起點），false 代表怪物被打倒
function hitMonster(m) {
  energy = Math.max(0, energy - 10);   // 被撞到：體力 -10，回到這一關的起點
  px = startX;
  py = startY;
  showMessage("👻 被怪物撞到！體力 -10，回到起點");
  return true;
}

// 每走一步，所有怪物動一下
function moveMonsters() {
  monsters.slice().forEach(function (m) {
    const nx = m.x + m.dir;
    if (canWalk(nx, m.y) && !monsterAt(nx, m.y)) {
      m.x = nx;                       // 往前走一格
    } else {
      m.dir = -m.dir;                 // 走不動了：轉身
    }
    if (m.x === px && m.y === py) hitMonster(m);
  });
}

// 移動玩家：dx、dy 是這一步要走的方向（往右 1,0　往左 -1,0　往下 0,1　往上 0,-1）
function movePlayer(dx, dy) {
  const nx = px + dx;                 // 想走去的那一格
  const ny = py + dy;
  const tile = grid[ny][nx];          // 那一格是什麼字

  if (tile === "#") {                 // 牆：走不過去
    showMessage("🧱 撞到牆了");
    return;
  }
  if (tile === "D" && !hasKey) {      // 門：沒有鑰匙就走不過去
    showMessage("🔒 門鎖住了，先找鑰匙");
    return;
  }

  px = nx;                            // 走過去
  py = ny;
  energy = energy - 1;                // 每走一步少 1 點體力
  showMessage("");

  if (monsterAt(px, py) && hitMonster(monsterAt(px, py))) {   // 走到怪物身上
    drawMap();
    updateTop();
    if (energy <= 0) loseGame();
    return;
  }

  if (tile === "K") {                 // 鑰匙：撿起來，那一格變地板
    hasKey = true;
    grid[ny][nx] = ".";
    showMessage("🔑 拿到鑰匙了！");
  }
  if (tile === "D") {                 // 有鑰匙的門：打開，那一格變地板
    grid[ny][nx] = ".";
    showMessage("🔓 門開了！");
  }

  if (tile === "E") {                 // 走到出口：還有下一關就載入，沒有了就贏
    if (level + 1 < maps.length) {
      loadMap(level + 1);
      showMessage("🎉 過關！第 " + (level + 1) + " 關");
    } else {
      drawMap();
      updateTop();
      winText.textContent = "你走出了 " + maps.length + " 座迷宮！";
      winGame();
    }
    return;
  }

  moveMonsters();                     // 怪物動一下

  drawMap();
  updateTop();
  if (energy <= 0) {                  // 體力用完：輸了
    loseGame();
  }
}

// 過關：顯示勝利畫面
function winGame() {
  playing = false;
  winScreen.classList.remove("hidden");
}

// 輸了：顯示失敗畫面
function loseGame() {
  playing = false;
  loseScreen.classList.remove("hidden");
}

// 開新的一局：回到第 1 關
function startGame() {
  loadMap(0);
  playing = true;
  startScreen.classList.add("hidden");
  winScreen.classList.add("hidden");
  loseScreen.classList.add("hidden");
}

// 鍵盤方向鍵（要先用滑鼠點一下遊戲視窗）
document.addEventListener("keydown", function (e) {
  if (!playing) return;
  if (e.key === "ArrowUp") { e.preventDefault(); movePlayer(0, -1); }
  if (e.key === "ArrowDown") { e.preventDefault(); movePlayer(0, 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); movePlayer(-1, 0); }
  if (e.key === "ArrowRight") { e.preventDefault(); movePlayer(1, 0); }
});

// 畫面上的四個方向按鈕（用滑鼠點）
document.getElementById("btnUp").addEventListener("click", function () { if (playing) movePlayer(0, -1); });
document.getElementById("btnDown").addEventListener("click", function () { if (playing) movePlayer(0, 1); });
document.getElementById("btnLeft").addEventListener("click", function () { if (playing) movePlayer(-1, 0); });
document.getElementById("btnRight").addEventListener("click", function () { if (playing) movePlayer(1, 0); });

// 按「開始」和「再玩一次」
document.getElementById("startBtn").addEventListener("click", startGame);
document.querySelectorAll(".againBtn").forEach(function (btn) {
  btn.addEventListener("click", startGame);
});

// 一打開網頁就先畫出第 1 關
loadMap(0);
  </script>
</body>
</html>
