<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記憶翻牌</title>
  <style>
/* ===== CSS 窗格 ===== */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: #10182b;
  font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  color: white;
  display: flex;
  justify-content: center;
}

#game {
  position: relative;
  width: min(100%, 560px);
  background: #17243a;
  border: 3px solid #344968;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 15px 50px #0008;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 12px 18px;
  background: linear-gradient(90deg, #10233c, #1e4260);
}
.brand { font-size: 22px; font-weight: 900; color: #65f3d1; }
.stat { font-weight: bold; color: #c8d8ef; }
.stat b { color: #ffe45e; font-size: 24px; }

#board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  padding: 18px;
}

/* 一張牌：蓋著的時候看不到 emoji */
.card {
  aspect-ratio: 3 / 4;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, #3b5bdb, #5f3dc4);
  border: 3px solid #91a7ff;
  cursor: pointer;
  user-select: none;
  transition: transform .2s, background .2s;
}
.card:hover { transform: translateY(-3px); }
.card .face { visibility: hidden; }

/* 翻開的牌（JS 加上 class "flipped"） */
.card.flipped { background: #f8f9fa; border-color: #ffe45e; }
.card.flipped .face { visibility: visible; }

/* 配對成功的牌（JS 加上 class "matched"） */
.card.matched { background: #d3f9d8; border-color: #51cf66; cursor: default; }
.card.matched .face { visibility: visible; }

/* 翻錯時可以加上 class "shake" 讓牌晃一下 */
.card.shake { animation: shake .4s; }
@keyframes shake {
  25% { translate: -6px 0; }
  75% { translate: 6px 0; }
}

/* 開始、勝利、失敗畫面 */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  background: #0b1222e6;
}
.overlay h1 { margin: 0; font-size: 44px; }
.overlay p { margin: 0; font-size: 20px; color: #c8d8ef; }
#startScreen h1 { color: #74c0fc; }
#winScreen h1 { color: #ffa94d; }
#loseScreen h1 { color: #ff6b6b; }

.overlay button {
  margin-top: 12px;
  padding: 12px 34px;
  font-size: 22px;
  font-weight: 900;
  color: #10182b;
  background: linear-gradient(#fff36b, #ffc940);
  border: none;
  border-radius: 999px;
  box-shadow: 0 5px 0 #c08a00;
  cursor: pointer;
}

.hidden { display: none !important; }
  </style>
</head>
<body>
<!-- ===== HTML 窗格 ===== -->
<div id="game">
  <div class="topbar">
    <span class="brand">🧠 記憶翻牌</span>
    <span id="timerStat" class="stat hidden">⏱ <b id="timer">60</b></span>
    <span class="stat">步數 <b id="moves">0</b> / <b id="maxMoves">20</b></span>
  </div>

  <div id="board"></div>

  <div id="startScreen" class="overlay">
    <h1>🧠 記憶翻牌</h1>
    <p>找出 6 對一樣的牌！</p>
    <p>一次翻兩張，20 步內全部配對就贏</p>
    <button id="startBtn">▶ 開始</button>
  </div>

  <div id="winScreen" class="overlay hidden">
    <h1>🏆 你贏了！</h1>
    <p id="winText">全部配對成功！</p>
    <button class="againBtn">↻ 再玩一次</button>
  </div>

  <div id="loseScreen" class="overlay hidden">
    <h1>💥 步數用完了</h1>
    <p>再試一次吧！</p>
    <button class="againBtn">↻ 再玩一次</button>
  </div>
</div>

  <script>
/* ===== JavaScript 窗格 ===== */
// ===== 記憶翻牌：起始遊戲 =====
// 現在：按「開始」會進入遊戲，牌會洗好排出來。
// 還不會：點牌翻開、比對、算步數、贏或輸。

const board = document.getElementById("board");
const startScreen = document.getElementById("startScreen");
const startBtn = document.getElementById("startBtn");

// 6 種 emoji，每種會放兩張
const emojis = ["🐱", "🐶", "🐸", "🦊", "🐼", "🐵"];

// 按了「開始」才是 true
let playing = false;

// 洗牌：把牌的順序打亂（每次都不一樣）
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

// 排出 12 張蓋著的牌
function buildBoard() {
  board.innerHTML = "";
  const cards = shuffle([...emojis, ...emojis]);
  cards.forEach(function (emoji) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.emoji = emoji;
    card.innerHTML = '<span class="face">' + emoji + "</span>";
    board.appendChild(card);
  });
}

// 按「開始」：關掉開始畫面，開始玩
startBtn.addEventListener("click", function () {
  startScreen.classList.add("hidden");
  playing = true;
});

buildBoard();
  </script>
</body>
</html>
