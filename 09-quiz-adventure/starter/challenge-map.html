<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>問答闖關</title>
  <style>
/* ===== CSS 窗格 ===== */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: #10182b;
  font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  color: white;
  display: flex;
  justify-content: center;
}

#game {
  position: relative;
  width: min(100%, 560px);
  min-height: 460px;
  background: #17243a;
  border: 3px solid #344968;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 15px 50px #0008;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 12px 18px;
  background: linear-gradient(90deg, #10233c, #1e4260);
}
.brand { font-size: 22px; font-weight: 900; color: #65f3d1; }
.stat { font-weight: bold; color: #c8d8ef; }
.stat b { color: #ffe45e; font-size: 22px; }
#hearts { font-size: 22px; letter-spacing: 2px; }

#quiz { padding: 22px 22px 18px; }
.progress { color: #c8d8ef; font-weight: bold; }
.progress b { color: #ffe45e; }

/* 題目 */
#question {
  margin: 10px 0 18px;
  min-height: 72px;
  font-size: 26px;
  font-weight: 900;
  line-height: 1.4;
}

/* 四個答案按鈕 */
#answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.answer {
  padding: 16px 10px;
  font-size: 22px;
  font-weight: 900;
  color: white;
  background: linear-gradient(135deg, #3b5bdb, #5f3dc4);
  border: 3px solid #91a7ff;
  border-radius: 12px;
  cursor: pointer;
  transition: transform .15s, background .2s;
}
.answer:hover { transform: translateY(-3px); }

/* 答對的按鈕（JS 加上 class "correct"） */
.answer.correct { background: #2b8a3e; border-color: #8ce99a; }
/* 答錯的按鈕（JS 加上 class "wrong"） */
.answer.wrong { background: #c92a2a; border-color: #ffa8a8; }
/* 可以加上 class "shake" 讓按鈕晃一下 */
.shake { animation: shake .4s; }
@keyframes shake {
  25% { translate: -6px 0; }
  75% { translate: 6px 0; }
}

/* 答完一題的回饋文字，例如「✔ 答對了！」 */
#feedback {
  margin-top: 16px;
  min-height: 34px;
  text-align: center;
  font-size: 24px;
  font-weight: 900;
}
#feedback.good { color: #8ce99a; }
#feedback.bad { color: #ffa8a8; }

/* 開始、勝利、失敗畫面 */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  background: #0b1222f0;
}
.overlay h1 { margin: 0; font-size: 44px; }
.overlay p { margin: 0; font-size: 20px; color: #c8d8ef; }
#startScreen h1 { color: #74c0fc; }
#winScreen h1 { color: #ffa94d; }
#loseScreen h1 { color: #ff6b6b; }
#stars { font-size: 52px; letter-spacing: 6px; min-height: 64px; }

.overlay button {
  margin-top: 12px;
  padding: 12px 34px;
  font-size: 22px;
  font-weight: 900;
  color: #10182b;
  background: linear-gradient(#fff36b, #ffc940);
  border: none;
  border-radius: 999px;
  box-shadow: 0 5px 0 #c08a00;
  cursor: pointer;
}

.hidden { display: none !important; }
  </style>
</head>
<body>
<!-- ===== HTML 窗格 ===== -->
<div id="game">
  <div class="topbar">
    <span class="brand">❓ 問答闖關</span>
    <span id="timerStat" class="stat hidden">⏱ <b id="timer">10</b></span>
    <span class="stat">分數 <b id="score">0</b></span>
    <span id="hearts">❤️❤️❤️</span>
  </div>

  <div id="quiz">
    <div class="progress">第 <b id="qNum">1</b> / <b id="qTotal">3</b> 題</div>
    <div id="question">題目</div>
    <div id="answers">
      <button class="answer">A</button>
      <button class="answer">B</button>
      <button class="answer">C</button>
      <button class="answer">D</button>
    </div>
    <div id="feedback"></div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>❓ 問答闖關</h1>
    <p>每一題選一個答案</p>
    <p>全部答完就過關！</p>
    <button id="startBtn">▶ 開始</button>
  </div>

  <div id="winScreen" class="overlay hidden">
    <h1>🏆 過關了！</h1>
    <div id="stars"></div>
    <p id="winText">你答完了所有題目！</p>
    <button class="againBtn">↻ 再玩一次</button>
  </div>

  <div id="loseScreen" class="overlay hidden">
    <h1>💔 愛心用完了</h1>
    <p id="loseText">再試一次吧！</p>
    <button class="againBtn">↻ 再玩一次</button>
  </div>
</div>

  <script>
/* ===== JavaScript 窗格 ===== */
// ===== 問答闖關：挑戰 C 範例（🗺️ 冒險地圖：走到關卡才答題，四步都做完）=====

// ===== 題目清單（資料）=====
// 每一題有：question 題目、choices 四個選項、answer 正確答案
const questions = [
  {
    question: "世界上最大的動物是什麼？",
    choices: ["大象", "藍鯨", "長頸鹿", "鯊魚"],
    answer: "藍鯨"
  },
  {
    question: "下面哪一種動物是哺乳類？",
    choices: ["海豚", "鯊魚", "鮭魚", "鯉魚"],
    answer: "海豚"
  },
  {
    question: "蜘蛛有幾隻腳？",
    choices: ["6 隻", "8 隻", "10 隻", "4 隻"],
    answer: "8 隻"
  },
  {
    question: "昆蟲有幾隻腳？",
    choices: ["4 隻", "8 隻", "10 隻", "6 隻"],
    answer: "6 隻"
  },
  {
    question: "長頸鹿的脖子有幾節骨頭？",
    choices: ["7 節", "20 節", "3 節", "50 節"],
    answer: "7 節"
  },
  {
    question: "下面哪一種鳥不會飛？",
    choices: ["麻雀", "老鷹", "企鵝", "鴿子"],
    answer: "企鵝"
  },
  {
    question: "青蛙小時候叫什麼？",
    choices: ["毛毛蟲", "蝌蚪", "小魚", "孑孓"],
    answer: "蝌蚪"
  },
  {
    question: "大貓熊最喜歡吃什麼？",
    choices: ["竹子", "香蕉", "魚", "胡蘿蔔"],
    answer: "竹子"
  },
  {
    question: "陸地上跑最快的動物是什麼？",
    choices: ["獅子", "馬", "獵豹", "兔子"],
    answer: "獵豹"
  },
  {
    question: "蝴蝶小時候是什麼？",
    choices: ["蝌蚪", "小鳥", "蝸牛", "毛毛蟲"],
    answer: "毛毛蟲"
  }
];

// ===== 地圖（資料）=====
// 🧙 = 玩家起點　1 2 3 = 三個關卡 🏰　# = 樹 🌲（不能走）　G = 寶箱 🎁（+1 顆愛心）　. = 空地
const mapRows = [
  "P..#....",
  ".#.#.1#.",
  ".#...#..",
  "..##.#.2",
  "...G.##.",
  "3#......",
];
// 每一關考哪幾題（從 0 開始數）：第 1 關考第 1–3 題，第 2 關第 4–6 題，第 3 關第 7–10 題
const stages = { "1": [0, 1, 2], "2": [3, 4, 5], "3": [6, 7, 8, 9] };

// ===== 遊戲規則 =====
const startScreen = document.getElementById("startScreen");
const startBtn = document.getElementById("startBtn");
const winScreen = document.getElementById("winScreen");
const loseScreen = document.getElementById("loseScreen");
const quiz = document.getElementById("quiz");
const questionText = document.getElementById("question");
const qNum = document.getElementById("qNum");
const qTotal = document.getElementById("qTotal");
const scoreText = document.getElementById("score");
const heartsText = document.getElementById("hearts");
const feedback = document.getElementById("feedback");
const stars = document.getElementById("stars");
const winText = document.getElementById("winText");
const answerButtons = document.querySelectorAll(".answer");
const brand = document.querySelector(".brand");   // 左上角的標題

const maxHearts = 3;

let score = 0;
let hearts = maxHearts;
let waiting = false;
let px = 0, py = 0;          // 玩家在第幾格（左右 x、上下 y）
let stage = "";              // 現在在哪一關（"" = 在地圖上走）
let stageList = [];          // 這一關的題號
let stageStep = 0;           // 這一關答到第幾題
let done = {};               // 哪幾關過了
let chestTaken = false;

// ===== 地圖畫面：用 JavaScript 做出來，跟題目區輪流出現 =====
const mapBox = document.createElement("div");
mapBox.id = "map";
mapBox.style.cssText = "padding:16px 22px;text-align:center;";
const mapGrid = document.createElement("div");
mapGrid.style.cssText = "display:inline-grid;grid-template-columns:repeat(8,52px);gap:3px;";
const mapMsg = document.createElement("div");
mapMsg.style.cssText = "margin-top:12px;font-size:20px;font-weight:900;color:#ffe45e;min-height:30px;";
mapBox.appendChild(mapGrid);
mapBox.appendChild(mapMsg);
quiz.before(mapBox);

function cellAt(x, y) {
  return mapRows[y][x];
}

function drawMap() {
  mapGrid.innerHTML = "";
  for (let y = 0; y < mapRows.length; y++) {
    for (let x = 0; x < mapRows[y].length; x++) {
      const c = cellAt(x, y);
      const cell = document.createElement("div");
      cell.style.cssText = "height:52px;display:flex;align-items:center;justify-content:center;" +
        "font-size:32px;border-radius:8px;background:#21436b;";
      let face = "";
      if (c === "#") { face = "🌲"; cell.style.background = "#173a2a"; }
      if (c === "G" && !chestTaken) face = "🎁";
      if (stages[c]) face = done[c] ? "✅" : "🏰";
      if (x === px && y === py) face = "🧙";
      cell.textContent = face;
      mapGrid.appendChild(cell);
    }
  }
}

// 顯示地圖（藏起題目）
function showMap(msg) {
  stage = "";
  brand.textContent = "🗺️ 冒險地圖";
  quiz.style.display = "none";
  mapBox.style.display = "block";
  mapMsg.textContent = msg;
  drawMap();
}

// 方向鍵走一格：不能走出地圖、不能穿過樹
document.addEventListener("keydown", function (e) {
  const moves = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  if (!moves[e.key]) return;
  e.preventDefault();                          // 方向鍵不要捲動網頁
  if (stage !== "" || !startScreen.classList.contains("hidden")) return;
  if (!winScreen.classList.contains("hidden") || !loseScreen.classList.contains("hidden")) return;
  const nx = px + moves[e.key][0];
  const ny = py + moves[e.key][1];
  if (ny < 0 || ny >= mapRows.length || nx < 0 || nx >= mapRows[0].length) return;
  if (cellAt(nx, ny) === "#") return;
  px = nx;
  py = ny;
  stepOn(cellAt(px, py));
});

// 走到某一格會發生什麼事
function stepOn(c) {
  if (c === "G" && !chestTaken) {             // 寶箱：+1 顆愛心
    chestTaken = true;
    if (hearts < maxHearts) hearts = hearts + 1;
    updateTop();
    showMap("🎁 打開寶箱：愛心 +1！");
    return;
  }
  if (stages[c] && !done[c]) {                 // 還沒過的關卡：開始答題
    startStage(c);
    return;
  }
  drawMap();
}

function startStage(c) {
  stage = c;
  stageList = stages[c];
  stageStep = 0;
  waiting = false;
  brand.textContent = "🏰 第 " + c + " 關";
  mapBox.style.display = "none";
  quiz.style.display = "block";
  showQuestion();
}

function updateTop() {
  scoreText.textContent = score;
  heartsText.textContent = "❤️".repeat(hearts) + "🤍".repeat(maxHearts - hearts);
}

function showQuestion() {
  const q = questions[stageList[stageStep]];
  qNum.textContent = stageStep + 1;
  qTotal.textContent = stageList.length;
  questionText.textContent = q.question;
  feedback.textContent = "";
  feedback.className = "";
  answerButtons.forEach(function (btn, i) {
    btn.textContent = q.choices[i];
    btn.classList.remove("correct", "wrong");
  });
}

function checkAnswer(btn) {
  if (waiting || stage === "") return;
  waiting = true;
  const q = questions[stageList[stageStep]];

  if (btn.textContent === q.answer) {
    btn.classList.add("correct");
    score = score + 1;
    feedback.textContent = "✔ 答對了！";
    feedback.className = "good";
  } else {
    btn.classList.add("wrong");
    answerButtons.forEach(function (b) {
      if (b.textContent === q.answer) b.classList.add("correct");
    });
    hearts = hearts - 1;
    feedback.textContent = "✘ 答錯了，答案是「" + q.answer + "」";
    feedback.className = "bad";
  }
  updateTop();
  setTimeout(nextQuestion, 1000);
}

function nextQuestion() {
  if (hearts <= 0) {
    loseScreen.classList.remove("hidden");
    return;
  }
  stageStep = stageStep + 1;
  if (stageStep < stageList.length) {
    waiting = false;
    showQuestion();
    return;
  }
  // 這一關答完了：變成 ✅，回到地圖
  done[stage] = true;
  if (Object.keys(done).length === Object.keys(stages).length) {
    showWin();
  } else {
    showMap("🏰 第 " + stage + " 關過了！去找下一個 🏰");
  }
}

function showWin() {
  let n = 1;
  if (score >= 9) n = 3;
  else if (score >= 6) n = 2;
  stars.textContent = "⭐".repeat(n);
  winText.textContent = "三關都過了！你答對了 " + score + " 題";
  winScreen.classList.remove("hidden");
}

// 開新的一局：回到起點，關卡和寶箱都恢復
function startGame() {
  score = 0;
  hearts = maxHearts;
  waiting = false;
  done = {};
  chestTaken = false;
  for (let y = 0; y < mapRows.length; y++) {
    const x = mapRows[y].indexOf("P");
    if (x >= 0) { px = x; py = y; }
  }
  updateTop();
  startScreen.classList.add("hidden");
  winScreen.classList.add("hidden");
  loseScreen.classList.add("hidden");
  showMap("用方向鍵走到 🏰 開始闖關");
}

answerButtons.forEach(function (btn) {
  btn.addEventListener("click", function () {
    checkAnswer(btn);
  });
});
startBtn.addEventListener("click", startGame);
document.querySelectorAll(".againBtn").forEach(function (btn) {
  btn.addEventListener("click", startGame);
});

updateTop();
showMap("用方向鍵走到 🏰 開始闖關");
  </script>
</body>
</html>
